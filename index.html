<!doctype html>
<html lang="es">
<head>

<title>Banco de Clase</title>
<style>
:root{--bg:#0f1730;--card:#1a2547;--card2:#223060;--txt:#eef1ff;--mut:#9aa6d1;--oro:#ffc83d;--ok:#2ecc8f;--mal:#ff5d6c;--pri:#5b7cff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{padding:16px 16px 96px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;color:var(--mut);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
p{margin:6px 0}
.nota{color:var(--mut);font-size:14px}
button{font:inherit;color:inherit;border:0;border-radius:var(--r);padding:12px 16px;background:var(--card2);min-height:48px;cursor:pointer}
button:active{filter:brightness(1.2)}
button.ok{background:var(--ok);color:#06251a;font-weight:700}
button.mal{background:var(--mal);color:#3a0710;font-weight:700}
button.pri{background:var(--pri);font-weight:700}
button.oro{background:var(--oro);color:#3a2a00;font-weight:700}
button.grande{width:100%;min-height:72px;font-size:19px;font-weight:700}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;color:var(--txt);background:var(--card);border:2px solid var(--card2);border-radius:var(--r);padding:12px;width:100%;min-height:48px}
textarea{min-height:140px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
form{display:grid;gap:10px;margin:10px 0}
.fila{display:flex;gap:10px}.fila>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{min-height:42px;padding:8px 14px;background:var(--card)}
.chips button.sel{background:var(--pri)}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:8px 0}
.lista{display:grid;gap:8px}
.fila-al{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card)}

.acciones .oro{grid-column:1/-1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.top h1{flex:1;margin:0}
.top button{min-width:48px;padding:8px}
.mov{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--card2)}

.pos{color:var(--ok);font-weight:700}.neg{color:var(--mal);font-weight:700}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0a1128;border-top:1px solid var(--card2);padding-bottom:env(safe-area-inset-bottom)}

#modal .hoja{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 28px}

.oculto{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
'use strict';
/* ===== Banco de Clase · app del docente · versión local (etapas 1 a 3 y 5) =====
   Los datos viven en este navegador (localStorage). Para que los alumnos consulten desde
   casa, en la etapa 4 se cambia la capa de datos por una base de datos en la nube. */

const KEY = 'bancoClase.v1';
const MONTOS = [50, 100, 200, 500];
const MOTIVOS = {
  gano: ['Participación', 'Tarea entregada', 'Buen comportamiento', 'Trabajo en equipo', 'Ayudó a un compañero'],
  perdio: ['Desorden', 'Tarea no entregada', 'Sin material', 'Faltó al respeto']
};
const CATALOGO_INICIAL = [
  ['asiento-vip', 'Bronce', 'Asiento VIP', 500, 'Elegir lugar o sentarse junto a un amigo un día completo; si hay desorden se pierde sin reembolso.'],
  ['playlist', 'Bronce', 'Playlist de Aventura', 600, 'Elegir la música ambiental del trabajo individual (instrumental, lofi o de videojuegos); sin reggaetón ni groserías, aprobada por el docente.'],
  ['escribano', 'Bronce', 'El Escribano del Reino / Plumón Mágico', 700, 'Hacer apuntes, exámenes o actividades del día con plumas de colores o plumones.'],
  ['avatar', 'Bronce', 'Creación de avatar', 800, 'Se genera la primera imagen del avatar personalizado.'],
  ['apunte', 'Bronce', 'Apunte mágico', 1000, 'Pedir impreso un dictado hecho en clase para pegarlo en el cuaderno.'],
  ['extension', 'Plata', 'Pase de Extensión de Vida', 800, '24 horas extra para entregar una tarea regular; no aplica a proyectos finales ni evaluaciones del mes.'],
  ['inmunidad', 'Plata', 'Inmunidad de Pizarra', 950, 'Un día de inmunidad: vale 10 en la evaluación continua de ese día.'],
  ['skin', 'Plata', 'Pase Cambio de Skin', 1100, 'Comprar accesorios únicos para el avatar.'],
  ['respawn', 'Oro', 'El Doble Intento / Respawn', 1300, 'Repetir una pregunta mal contestada en trabajos diarios o quizzes pequeños para recuperar puntos.'],
  ['skip', 'Oro', 'Pase Skip Tarea', 1500, 'Cancela una tarea regular con calificación completa; no acumulable para proyectos de fin de bloque; máximo 1 uso al mes.', 1],
  ['juego', 'Oro', 'Modo de Juego / Lectura Libre', 1800, '30 minutos de juego de mesa o lectura libre en el bloque lúdico grupal, excepto el último viernes del mes.']
];

/* ---------- Datos ---------- */
function datosIniciales() {
  return {
    version: 1, auth: null, alumnos: [], movimientos: [], compras: [],
    catalogo: CATALOGO_INICIAL.map(([id, nivel, nombre, precio, regla, limiteMes]) => ({ id, nivel, nombre, precio, regla, limiteMes: limiteMes || 0, activo: true }))
  };
}
let db = cargar();
function cargar() {
  try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : datosIniciales(); }
  catch (e) { return datosIniciales(); }
}
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { aviso('No se pudo guardar en este teléfono. Exporta un respaldo ya.'); }
  programarNube();
}

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = n => Number(n).toLocaleString('es-MX');
const fechaCorta = ts => new Date(ts).toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const normId = s => String(s || '').replace(/[\s:\-]/g, '').toUpperCase();
const mismoMes = ts => { const a = new Date(ts), b = new Date(); return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); };
const alumnoPor = id => db.alumnos.find(a => a.id === id);
let tAviso = null;
function aviso(t) {
  const el = $('#toast'); if (!el) return;
  el.textContent = t; el.style.display = 'block';
  clearTimeout(tAviso); tAviso = setTimeout(() => { el.style.display = 'none'; }, 3200);
}
function codigoAcceso() {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c;
  do {
    const b = new Uint8Array(8); crypto.getRandomValues(b);
    c = [...b].map(x => L[x % L.length]).join('');
  } while (db.alumnos.some(a => a.codigo === c));
  return c;
}
async function hashPw(pw, sal) {
  const datos = new TextEncoder().encode(sal + pw);
  if (crypto.subtle) {
    const d = await crypto.subtle.digest('SHA-256', datos);
    return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const b of datos) h = ((h * 33) ^ b) >>> 0; return String(h);
}
// La sesión vive en memoria; sessionStorage solo ayuda a conservarla al recargar (puede estar bloqueado).
let sesionActiva = false;
const sesion = () => { if (sesionActiva) return true; try { return sessionStorage.getItem('s') === '1'; } catch (e) { return false; } };
const setSesion = v => { sesionActiva = v; try { v ? sessionStorage.setItem('s', '1') : sessionStorage.removeItem('s'); } catch (e) { } };
const almacenamientoOk = (() => { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } })();
const bannerAlmacen = () => almacenamientoOk ? '' : '<div class="card" style="background:#5a2a00;margin:12px"><b>Este navegador no deja guardar datos aquí.</b><p class="nota" style="color:#ffd9b0">Pasa al abrir el archivo directo desde Descargas. Publica la página en una dirección https (Netlify o GitHub Pages) y ábrela en Chrome; si no, todo se pierde al cerrar.</p></div>';

/* ---------- Lógica del banco ---------- */
// delta es con signo; el saldo siempre es la suma de los deltas. Un movimiento anulado
// y su corrección se cancelan y no cuentan en ganado, perdido ni gastado.
function addMov({ alumnoId, tipo, delta, motivo, anulaA, compraId }) {
  const m = { id: uid(), alumnoId, tipo, delta, motivo, ts: Date.now() };
  if (anulaA) m.anulaA = anulaA;
  if (compraId) m.compraId = compraId;
  db.movimientos.push(m); return m;
}
function cuenta(alumnoId) {
  const movs = db.movimientos.filter(m => m.alumnoId === alumnoId);
  const anulados = new Set(movs.filter(m => m.anulaA).map(m => m.anulaA));
  let saldo = 0, ganado = 0, perdido = 0, gastado = 0;
  for (const m of movs) {
    saldo += m.delta;
    if (m.anulaA || anulados.has(m.id)) continue;
    if (m.tipo === 'gano') ganado += m.delta;
    else if (m.tipo === 'perdio') perdido -= m.delta;
    else if (m.tipo === 'gasto') gastado -= m.delta;
  }
  return { saldo, ganado, perdido, gastado, anulados };
}
function movimientosDe(alumnoId) { return db.movimientos.filter(m => m.alumnoId === alumnoId).slice().reverse(); }
function registrar(alumnoId, tipo, monto, motivo) {
  const a = alumnoPor(alumnoId);
  if (!a) return 'Alumno no encontrado.';
  if (!Number.isInteger(monto) || monto < 1) return 'Escribe un monto entero mayor a 0.';
  if (!motivo || !motivo.trim()) return 'Escribe el motivo.';
  if (tipo === 'perdio' && monto > cuenta(alumnoId).saldo) return 'El alumno no tiene tantas monedas para restar.';
  addMov({ alumnoId, tipo, delta: tipo === 'gano' ? monto : -monto, motivo: motivo.trim() });
  guardar(); return null;
}
function deshacerMov(movId) {
  const m = db.movimientos.find(x => x.id === movId);
  if (!m || m.anulaA) return 'No se puede deshacer este movimiento.';
  if (db.movimientos.some(x => x.anulaA === movId)) return 'Ese movimiento ya estaba deshecho.';
  addMov({ alumnoId: m.alumnoId, tipo: 'correccion', delta: -m.delta, motivo: 'Corrección: ' + m.motivo, anulaA: m.id });
  if (m.compraId) { const c = db.compras.find(x => x.id === m.compraId); if (c) c.estado = 'anulada'; }
  guardar(); return null;
}
function usosEsteMes(alumnoId, itemId) {
  return db.compras.filter(c => c.alumnoId === alumnoId && c.itemId === itemId && c.estado !== 'anulada' && mismoMes(c.ts)).length;
}
function motivoNoCompra(alumnoId, item) {
  if (!item.activo) return 'No disponible';
  if (cuenta(alumnoId).saldo < item.precio) return 'Faltan ' + fmt(item.precio - cuenta(alumnoId).saldo);
  if (item.limiteMes && usosEsteMes(alumnoId, item.id) >= item.limiteMes) return 'Límite del mes alcanzado';
  return null;
}
function comprar(alumnoId, itemId) {
  const item = db.catalogo.find(i => i.id === itemId);
  if (!item || !alumnoPor(alumnoId)) return 'No se encontró la compra.';
  const por = motivoNoCompra(alumnoId, item); if (por) return por;
  const compra = { id: uid(), alumnoId, itemId, nombre: item.nombre, precio: item.precio, estado: 'pendiente', ts: Date.now() };
  db.compras.push(compra);
  addMov({ alumnoId, tipo: 'gasto', delta: -item.precio, motivo: 'Compra: ' + item.nombre, compraId: compra.id });
  guardar(); return null;
}
function canjear(compraId) {
  const c = db.compras.find(x => x.id === compraId);
  if (!c || c.estado !== 'pendiente') return false;
  c.estado = 'canjeado'; c.canjeTs = Date.now(); guardar(); return true;
}

/* ---------- Nube (Supabase) ----------
   La app sigue funcionando sin internet: guarda en el teléfono y, cuando hay conexión,
   envía una copia de las cuentas a la nube para que el alumno la consulte. Solo tú escribes. */
const CFG = globalThis.CONFIG || {};
const nubeLista = () => !!(CFG.url && CFG.key && !String(CFG.url).includes('TU-PROYECTO'));
const NK = 'bancoClase.nube';
const nube = { sesion: null, pendiente: false, ultima: null, error: null };
let tNube = null, nubeEnVuelo = false;
function leerSesionNube() { try { return JSON.parse(localStorage.getItem(NK) || 'null'); } catch (e) { return null; } }
function guardarSesionNube(s) { try { s ? localStorage.setItem(NK, JSON.stringify(s)) : localStorage.removeItem(NK); } catch (e) { } }
async function nubeLogin(email, pw) {
  const r = await fetch(CFG.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pw }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || 'No se pudo iniciar sesión en la nube.');
  nube.sesion = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + Math.max(60, (j.expires_in || 3600) - 60) * 1000, email };
  guardarSesionNube(nube.sesion);
}
async function tokenNube() {
  const s = nube.sesion; if (!s) throw new Error('Sin sesión en la nube.');
  if (Date.now() < s.exp) return s.access;
  const r = await fetch(CFG.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { nube.sesion = null; guardarSesionNube(null); throw new Error('La sesión de la nube venció. Vuelve a conectarte en Más.'); }
  nube.sesion = { access: j.access_token, refresh: j.refresh_token, exp: Date.now() + Math.max(60, (j.expires_in || 3600) - 60) * 1000, email: s.email };
  guardarSesionNube(nube.sesion); return nube.sesion.access;
}
function snapshotNube() {
  const filas = db.alumnos.filter(a => a.activo).map(a => {
    const c = cuenta(a.id);
    return {
      codigo: a.codigo, nombre: a.nombre, saldo: c.saldo, ganado: c.ganado, perdido: c.perdido, gastado: c.gastado,
      movimientos: movimientosDe(a.id).slice(0, 100).map(m => ({ id: m.id, t: m.ts, d: m.delta, m: m.motivo, k: m.tipo, u: c.anulados.has(m.id) ? 1 : 0 })),
      compras: db.compras.filter(x => x.alumnoId === a.id && x.estado !== 'anulada').slice(-30).reverse().map(x => ({ n: x.nombre, p: x.precio, e: x.estado, t: x.ts })),
      actualizado: new Date().toISOString()
    };
  });
  const tienda = db.catalogo.filter(i => i.activo).map(i => ({ id: i.id, nivel: i.nivel, nombre: i.nombre, precio: i.precio, regla: i.regla }));
  return { filas, tienda };
}
async function enviarNube() {
  const tk = await tokenNube();
  const h = { apikey: CFG.key, Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' };
  const { filas, tienda } = snapshotNube();
  const ok = async (r, que) => { if (!r.ok) { let t = ''; try { t = (await r.json()).message || ''; } catch (e) { } throw new Error(que + ' (' + r.status + ') ' + t); } };
  if (filas.length) await ok(await fetch(CFG.url + '/rest/v1/cuentas?on_conflict=codigo', { method: 'POST', headers: { ...h, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(filas) }), 'No se pudieron enviar las cuentas');
  const filtro = filas.length ? 'codigo=not.in.(' + filas.map(f => f.codigo).join(',') + ')' : 'codigo=neq.-';
  await ok(await fetch(CFG.url + '/rest/v1/cuentas?' + filtro, { method: 'DELETE', headers: { ...h, Prefer: 'return=minimal' } }), 'No se pudo limpiar la nube');
  await ok(await fetch(CFG.url + '/rest/v1/tienda?on_conflict=id', { method: 'POST', headers: { ...h, Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify([{ id: 1, items: tienda, actualizado: new Date().toISOString() }]) }), 'No se pudo enviar la tienda');
}
function programarNube() {
  if (!nubeLista() || !nube.sesion) return;
  nube.pendiente = true; pintarEstadoNube();
  clearTimeout(tNube); tNube = setTimeout(sincronizar, 1200);
}
async function sincronizar() {
  if (!nubeLista() || !nube.sesion) return;
  if (nubeEnVuelo) { programarNube(); return; }
  nubeEnVuelo = true; nube.pendiente = false;
  try { await enviarNube(); nube.ultima = Date.now(); nube.error = null; }
  catch (e) {
    nube.error = (e && e.message) || 'Sin conexión'; nube.pendiente = true;
    if (nube.sesion) { clearTimeout(tNube); tNube = setTimeout(sincronizar, 15000); }
  } finally { nubeEnVuelo = false; pintarEstadoNube(); }
}
function textoNube() {
  if (!nubeLista()) return 'Nube sin configurar';
  if (!nube.sesion) return 'Nube sin conectar';
  if (nube.error) return 'Nube: ' + nube.error + ' · reintentando';
  if (nube.pendiente) return 'Nube: enviando…';
  return nube.ultima ? 'Nube al día · ' + new Date(nube.ultima).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : 'Nube conectada';
}
function pintarEstadoNube() {
  if (typeof document === 'undefined' || !document.querySelectorAll) return;
  document.querySelectorAll('.estadoNube').forEach(e => { e.textContent = textoNube(); });
}
function urlAlumno(a) {
  const base = CFG.alumnoUrl || new URL('alumno.html', location.href).href;
  return base.split('#')[0] + '#' + a.codigo;
}

/* ---------- NFC ---------- */
let nfcCtl = null, escCtl = null, scanMode = { tipo: 'buscar' }, modalAbierto = false;
async function activarNFC() {
  if (!('NDEFReader' in window)) { aviso('Este navegador no lee NFC. Usa Chrome en un Android con NFC.'); return false; }
  if (nfcCtl) return true;
  try {
    const lector = new NDEFReader(); const ctl = new AbortController();
    await lector.scan({ signal: ctl.signal });
    nfcCtl = ctl;
    lector.onreading = e => { if (navigator.vibrate) navigator.vibrate(60); alLeerTarjeta(normId(e.serialNumber), codigoDeMensaje(e.message)); };
    lector.onreadingerror = () => aviso('No se pudo leer la tarjeta. Intenta de nuevo.');
    return true;
  } catch (err) {
    aviso(err && err.name === 'NotAllowedError' ? 'Permiso de NFC denegado. Actívalo en el navegador.' : 'No se pudo activar NFC. Revisa que esté encendido.');
    return false;
  }
}
// Si la tarjeta ya tiene grabado el enlace del alumno, saca el código que va después del "#".
function codigoDeMensaje(msg) {
  try {
    for (const rec of (msg && msg.records) || []) {
      if (rec.recordType !== 'url' && rec.recordType !== 'text') continue;
      const txt = new TextDecoder(rec.encoding || 'utf-8').decode(rec.data);
      const m = txt.match(/#([A-Za-z0-9]{6,24})/);
      if (m) return m[1].toUpperCase();
    }
  } catch (e) { }
  return null;
}
function alLeerTarjeta(id, codigo) {
  if (!id && !codigo) { aviso('La tarjeta no entregó un código. Prueba con otra.'); return; }
  if (scanMode.tipo === 'vincular') { if (id) asignarTarjeta(scanMode.alumnoId, id); return; }
  if (modalAbierto) return;
  const a = (id && db.alumnos.find(x => x.tarjeta === id)) || (codigo && db.alumnos.find(x => x.codigo === codigo));
  if (a) {
    if (!a.tarjeta && id) { a.tarjeta = id; guardar(); }
    ui.alumnoId = a.id; render(); window.scrollTo(0, 0);
  } else modalTarjetaNueva(id);
}
// Graba en la tarjeta el enlace personal del alumno: al escanearla con cualquier celular se abre su cuenta.
async function escribirTarjeta(alumnoId) {
  const a = alumnoPor(alumnoId); if (!a) return;
  const url = urlAlumno(a);
  if (!/^https:\/\//i.test(url)) { aviso('Publica primero las páginas en una dirección https para grabar la tarjeta.'); return; }
  if (!('NDEFReader' in window)) { aviso('Este navegador no escribe NFC. Usa Chrome en Android.'); return; }
  const estabaLeyendo = !!nfcCtl;
  if (nfcCtl) { nfcCtl.abort(); nfcCtl = null; }
  abrirModal('<h1>Grabar tarjeta</h1><p class="centro pulso" style="font-size:18px;margin:18px 0">Acerca la tarjeta de <b>' + esc(a.nombre) + '</b> al teléfono y no la muevas…</p><p class="nota" style="word-break:break-all">' + esc(url) + '</p><button style="width:100%;margin-top:14px" data-act="cerrarModal">Cancelar</button>');
  try {
    const w = new NDEFReader(); escCtl = new AbortController();
    await w.write({ records: [{ recordType: 'url', data: url }] }, { signal: escCtl.signal });
    escCtl = null; cerrarModal(); aviso('Tarjeta grabada. Pruébala acercándola otra vez.');
  } catch (err) {
    escCtl = null;
    if (err && err.name !== 'AbortError') { cerrarModal(); aviso(err.name === 'NotAllowedError' ? 'Permiso de NFC denegado.' : 'No se pudo grabar. Mantén la tarjeta quieta e inténtalo de nuevo.'); }
  } finally { if (estabaLeyendo) activarNFC(); }
}
function asignarTarjeta(alumnoId, id) {
  const otro = db.alumnos.find(x => x.tarjeta === id && x.id !== alumnoId);
  if (otro) { aviso('Esa tarjeta ya es de ' + otro.nombre + '.'); return; }
  const a = alumnoPor(alumnoId); if (!a) return;
  a.tarjeta = id; guardar();
  scanMode = { tipo: 'buscar' }; cerrarModal(); aviso('Tarjeta vinculada a ' + a.nombre + '.'); render();
}

/* ---------- Acciones ---------- */
function descargar(nombre, tipo, texto) {
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const hoy = () => new Date().toISOString().slice(0, 10);
function csvMovimientos() {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const anulados = new Set(db.movimientos.filter(m => m.anulaA).map(m => m.anulaA));
  const filas = [['Fecha', 'Alumno', 'Tipo', 'Monedas', 'Motivo', 'Estado']];
  for (const m of db.movimientos) {
    const a = alumnoPor(m.alumnoId);
    filas.push([new Date(m.ts).toLocaleString('es-MX'), a ? a.nombre : '?', m.tipo, m.delta, m.motivo, m.anulaA ? 'corrección' : (anulados.has(m.id) ? 'deshecho' : 'vigente')]);
  }
  return '\ufeff' + filas.map(f => f.map(q).join(',')).join('\r\n');
}
function actualizarSeleccion(contenedor, boton) {
  document.querySelectorAll(contenedor + ' button').forEach(b => b.classList.remove('sel')); boton.classList.add('sel');
}

  cambiarPw: async () => {

    if (p.length < 6) { aviso('Debe tener al menos 6 caracteres.'); return; }
    const sal = uid(); db.auth = { sal, hash: await hashPw(p, sal) }; guardar(); aviso('Contraseña cambiada.');

};
function leerRespaldo(archivo) {
  if (!archivo) return;

  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.alumnos) || !Array.isArray(d.movimientos) || !Array.isArray(d.catalogo) || !Array.isArray(d.compras)) throw new Error('formato');

      db = Object.assign(datosIniciales(), d, { auth: db.auth }); guardar(); ui.alumnoId = null; render(); aviso('Respaldo restaurado.');

}
const FORMAS = {

    const sal = uid(); db.auth = { sal, hash: await hashPw(pw, sal) }; guardar(); setSesion(true); render();
  },
  login: async f => {
    if (await hashPw(f.pw.value, db.auth.sal) === db.auth.hash) { setSesion(true); render(); } else aviso('Contraseña incorrecta.');
  },
  manual: f => {
    const q = f.q.value.trim(); if (!q) return;
    const porTarjeta = db.alumnos.find(a => a.tarjeta === normId(q));
    const porNombre = db.alumnos.filter(a => a.nombre.toLowerCase().includes(q.toLowerCase()));
    const hallado = porTarjeta || (porNombre.length === 1 ? porNombre[0] : null);
    if (hallado) { ui.alumnoId = hallado.id; render(); window.scrollTo(0, 0); }
    else if (porNombre.length) { ui.tab = 'alumnos'; render(); const b = $('#buscar'); if (b) { b.value = q; filtrarAlumnos(q); } }
    else aviso('No se encontró ningún alumno.');
  },
  nube: async f => {
    try { await nubeLogin(f.email.value.trim(), f.pw.value); }
    catch (e) { aviso(e.message || 'No se pudo conectar.'); return; }
    render(); aviso('Conectado a la nube.'); sincronizar();
  },
  vincularManual: f => { const id = normId(f.codigo.value); if (id) asignarTarjeta(scanMode.alumnoId, id); }
};
function filtrarAlumnos(q) {
  const t = q.trim().toLowerCase();
  document.querySelectorAll('#listaAl [data-n]').forEach(b => b.classList.toggle('oculto', t && !b.dataset.n.includes(t)));
}
function iniciar() {
  document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && A[t.dataset.act]) A[t.dataset.act](t.dataset, t); });
  document.addEventListener('submit', e => {
    e.preventDefault(); const f = e.target.dataset.form;
    if (FORMAS[f]) Promise.resolve().then(() => FORMAS[f](e.target)).catch(err => aviso('Error: ' + (err && err.message ? err.message : err)));

  nube.sesion = leerSesionNube(); if (nube.sesion) programarNube();
  render();
}
if (typeof window === 'undefined') globalThis.__api = { FORMAS, sesion, render, nube, snapshotNube, enviarNube, nubeLogin, sincronizar, codigoDeMensaje, alLeerTarjeta, urlAlumno, db: () => db, reset: () => { db = datosIniciales(); }, addMov, cuenta, registrar, deshacerMov, comprar, canjear, motivoNoCompra, csvMovimientos, uid };
else iniciar();
</script>
